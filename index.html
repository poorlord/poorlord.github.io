<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>channelpoor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>channelpoor</h1>
      <p>Animation, art, and strange things for sale.</p>
      <nav>
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="shop">
      <h2>Shop</h2>

      <div class="product-grid">
        <article class="product">
          <img src="https://via.placeholder.com/500x500?text=Item+1" alt="Item 1">
          <h3>Item One</h3>
          <p>$20</p>
          <a class="button" href="#">Buy</a>
        </article>

        <article class="product">
          <img src="https://via.placeholder.com/500x500?text=Item+2" alt="Item 2">
          <h3>Item Two</h3>
          <p>$25</p>
          <a class="button" href="#">Buy</a>
        </article>

        <article class="product">
          <img src="https://via.placeholder.com/500x500?text=Item+3" alt="Item 3">
          <h3>Item Three</h3>
          <p>$30</p>
          <a class="button" href="#">Buy</a>
        </article>
      </div>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>channelpoor is home for my animation, artwork, and selected items.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>
        Instagram:
        <a href="https://instagram.com/channelpoor" target="_blank" rel="noopener noreferrer">
          @channelpoor
        </a>
      </p>
    </section>
  </main>
</body>
</html>
